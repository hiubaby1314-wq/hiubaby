name: Keep Site Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" https://hvqjbj9n.mule.page/
          echo "Site pinged at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
