name: Deploy to HK VPS

on:
  push:
    branches:
      - main
    paths:
      - 'lizi-materials/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hong Kong VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            echo "======================================"
            echo "🚀 Starting deployment - $(date)"
            echo "======================================"

            # Fetch + hard reset (handles any local drift)
            echo "[1/4] Syncing code..."
            git -C /opt/hiubaby fetch origin main
            git -C /opt/hiubaby reset --hard origin/main
            echo "  ✓ Code synced to latest"

            # Update dependencies
            echo "[2/4] Updating dependencies..."
            cd /opt/hiubaby/lizi-materials
            npm ci --production --prefer-offline 2>&1 | tail -5
            echo "  ✓ Dependencies ready"

            # Graceful PM2 reload (zero-downtime)
            echo "[3/4] Reloading app via PM2..."
            pm2 reload lizi-materials --update-env
            echo "  ✓ App reloaded"

            # Health check
            echo "[4/4] Health check..."
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "  ✓ Site is healthy (HTTP $STATUS)"
            else
              echo "  ❌ Health check failed (HTTP $STATUS)"
              pm2 logs lizi-materials --lines 20 --nostream
              exit 1
            fi

            echo "======================================"
            echo "✅ Deployment complete - $(date)"
            echo "======================================"
