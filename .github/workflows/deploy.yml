name: Deploy to HK VPS

on:
  push:
    branches:
      - main
    paths:
      - 'lizi-materials/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hong Kong VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            echo "======================================"
            echo "🚀 Starting deployment - $(date)"
            echo "======================================"

            # Navigate to project directory
            cd /opt/hiubaby/lizi-materials

            # Pull latest code
            echo "[1/4] Pulling latest code..."
            git -C /opt/hiubaby pull origin main
            echo "  ✓ Code updated"

            # Rebuild app container only (keeps nginx + certbot running)
            echo "[2/4] Building new Docker image..."
            docker compose build app
            echo "  ✓ Build complete"

            # Restart app with zero-downtime (nginx stays up)
            echo "[3/4] Restarting app container..."
            docker compose up -d --no-deps app
            echo "  ✓ App restarted"

            # Health check
            echo "[4/4] Health check..."
            sleep 8
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "  ✓ Site is healthy (HTTP $STATUS)"
            else
              echo "  ❌ Health check failed (HTTP $STATUS)"
              docker compose logs --tail=30 app
              exit 1
            fi

            echo "======================================"
            echo "✅ Deployment complete - $(date)"
            echo "======================================"
